[wokwi]
version = 1
# Use combined firmware image that includes bootloader, partitions, and application
# This is the recommended approach for Wokwi to ensure proper filesystem support
firmware = "firmware-combined.bin"
elf = "firmware.elf"
gdbServerPort=3333

# Combined firmware layout:
#   0x1000  - bootloader
#   0x8000  - partition table
#   0x10000 - application

[[net.forward]]
# Forward the web server port
from = "localhost:8080"
to = "target:80"
